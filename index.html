<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Pengundian Kursi Dinamis</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 20px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { color: #2c3e50; margin-bottom: 5px; font-size: 24px; }
        
        .setup-box {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            text-align: left;
        }
        .input-group label {
            font-size: 12px;
            font-weight: bold;
            color: #495057;
            margin-bottom: 5px;
        }
        .input-group input {
            padding: 8px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            width: 100px;
            font-size: 14px;
        }

        .counter {
            font-size: 18px;
            color: #7f8c8d;
            margin-bottom: 15px;
            font-weight: 600;
        }
            #storage-notice {
                display: none;
                margin-bottom: 15px;
                color: #8a4b08;
                font-size: 14px;
            }
        #display-number {
            font-size: 90px;
            font-weight: bold;
            color: #3498db;
            margin: 20px 0;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ecf0f1;
            border-radius: 10px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        #action-btn {
            font-size: 20px;
            padding: 12px 40px;
            cursor: pointer;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
            width: 220px;
        }
        #action-btn:hover { background-color: #27ae60; }
        #action-btn.rolling { background-color: #e74c3c; }
        #action-btn.rolling:hover { background-color: #c0392b; }
        #action-btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        .opt-buttons {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }
        .opt-btn {
            background: none;
            border: none;
            cursor: pointer;
            text-decoration: underline;
            font-size: 14px;
            font-weight: 500;
        }
        #export-btn { color: #2980b9; }
        #export-btn:hover { color: #1a5276; }
        #reset-btn { color: #e74c3c; }
        #reset-btn:hover { color: #c0392b; }

        .history-box {
            margin-top: 30px;
            text-align: left;
        }
        .history-title {
            font-weight: bold;
            color: #34495e;
            border-bottom: 2px solid #bdc3c7;
            padding-bottom: 5px;
        }
        #history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px 0;
            list-style: none;
            margin: 0;
        }
        .history-item {
            background: #34495e;
            color: white;
            padding: 5px 12px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Undian Nomor Kursi Acak</h1>
    
    <!-- Pengaturan Dinamis -->
    <div class="setup-box">
        <div class="input-group">
            <label for="input-people">Jumlah Orang</label>
            <input type="number" id="input-people" value="33" min="1">
        </div>
        <div class="input-group">
            <label for="input-seats">Jumlah Kursi</label>
            <input type="number" id="input-seats" value="33" min="1">
        </div>
    </div>

    <div class="counter" id="person-counter">Orang ke: 1 / 33</div>
    <div id="storage-notice" role="status"></div>
    
    <div id="display-number">--</div>
    
    <div class="btn-group">
        <button id="action-btn">MULAI ACAK</button>
        
        <div class="opt-buttons">
            <button id="export-btn" class="opt-btn">Simpan ke Excel (CSV)</button>
            <button id="reset-btn" class="opt-btn">Reset & Ulang</button>
        </div>
    </div>

    <div class="history-box">
        <div class="history-title">Riwayat Hasil Undian:</div>
        <ul id="history-list"></ul>
    </div>
</div>

<script>
    let maxPeople = 33;
    let maxSeats = 33;
    
    let availableNumbers = [];
    let chosenNumbers = [];
    let currentPerson = 1;
    let intervalId = null;
    let isRolling = false;
    let storageWarningShown = false;

    const storageKeys = [
        'dyn_chosenNumbers',
        'dyn_availableNumbers',
        'dyn_currentPerson',
        'dyn_maxPeople',
        'dyn_maxSeats'
    ];

    const display = document.getElementById('display-number');
    const btn = document.getElementById('action-btn');
    const counterDisplay = document.getElementById('person-counter');
    const historyList = document.getElementById('history-list');
    const inputPeople = document.getElementById('input-people');
    const inputSeats = document.getElementById('input-seats');
    const storageNotice = document.getElementById('storage-notice');

    function showStorageWarning(error) {
        if (storageWarningShown) return;

        storageWarningShown = true;
        storageNotice.innerText = 'Penyimpanan browser tidak tersedia. Undian tetap berjalan, tetapi hasil tidak tersimpan setelah halaman ditutup.';
        storageNotice.style.display = 'block';
        console.warn('Penyimpanan lokal tidak tersedia; aplikasi berjalan tanpa penyimpanan permanen.', error);
    }

    function readSavedValue(key) {
        try {
            return window.localStorage.getItem(key);
        } catch (error) {
            showStorageWarning(error);
            return null;
        }
    }

    function loadSavedData() {
        const savedChosen = readSavedValue('dyn_chosenNumbers');
        const savedAvailable = readSavedValue('dyn_availableNumbers');
        const savedPerson = readSavedValue('dyn_currentPerson');
        const savedMaxPeople = readSavedValue('dyn_maxPeople');
        const savedMaxSeats = readSavedValue('dyn_maxSeats');

        if (savedChosen && savedAvailable && savedPerson && savedMaxPeople && savedMaxSeats) {
            chosenNumbers = JSON.parse(savedChosen);
            availableNumbers = JSON.parse(savedAvailable);
            currentPerson = parseInt(savedPerson);
            maxPeople = parseInt(savedMaxPeople);
            maxSeats = parseInt(savedMaxSeats);

            inputPeople.value = maxPeople;
            inputSeats.value = maxSeats;
            
            // Kunci input jika proses undian sudah berjalan agar tidak mengubah aturan di tengah jalan
            toggleInputs(chosenNumbers.length > 0);

            historyList.innerHTML = '';
            chosenNumbers.forEach((num, index) => {
                renderHistoryItem(index + 1, num);
            });
            
            updateUIState();
        } else {
            initNewGame();
        }
    }

    function initNewGame() {
        maxPeople = parseInt(inputPeople.value) || 33;
        maxSeats = parseInt(inputSeats.value) || 33;

        // Validasi pengaman jika jumlah orang melebihi kursi yang tersedia
        if (maxPeople > maxSeats) {
            alert("Peringatan: Jumlah orang tidak boleh lebih banyak dari jumlah kursi!");
            inputPeople.value = maxSeats;
            maxPeople = maxSeats;
        }

        availableNumbers = Array.from({length: maxSeats}, (_, i) => i + 1);
        chosenNumbers = [];
        currentPerson = 1;
        
        display.innerText = "--";
        historyList.innerHTML = '';
        toggleInputs(false);
        saveToLocalStorage();
        updateUIState();
    }

    function applySettings() {
        // Hanya ubah setelan jika undian belum dimulai
        if (chosenNumbers.length === 0) {
            initNewGame();
        }
    }

    function toggleInputs(disabled) {
        inputPeople.disabled = disabled;
        inputSeats.disabled = disabled;
        if(disabled) {
            inputPeople.style.opacity = "0.6";
            inputSeats.style.opacity = "0.6";
        } else {
            inputPeople.style.opacity = "1";
            inputSeats.style.opacity = "1";
        }
    }

    function saveToLocalStorage() {
        try {
            window.localStorage.setItem('dyn_chosenNumbers', JSON.stringify(chosenNumbers));
            window.localStorage.setItem('dyn_availableNumbers', JSON.stringify(availableNumbers));
            window.localStorage.setItem('dyn_currentPerson', currentPerson.toString());
            window.localStorage.setItem('dyn_maxPeople', maxPeople.toString());
            window.localStorage.setItem('dyn_maxSeats', maxSeats.toString());
        } catch (error) {
            showStorageWarning(error);
        }
    }

    function updateUIState() {
        if (isRolling) return;

        if (chosenNumbers.length > 0) {
            display.innerText = chosenNumbers[chosenNumbers.length - 1];
        } else {
            display.innerText = "--";
        }

        if (currentPerson > maxPeople) {
            counterDisplay.innerText = `Selesai! Semua (${maxPeople}) orang telah mendapat kursi.`;
            btn.disabled = true;
            btn.innerText = "SELESAI";
        } else {
            counterDisplay.innerText = `Orang ke: ${currentPerson} / ${maxPeople}`;
            btn.disabled = false;
            btn.innerText = "MULAI ACAK";
            btn.classList.remove('rolling');
        }
    }

    function handleButtonClick() {
        if (currentPerson > maxPeople) return;

        if (!isRolling) {
            isRolling = true;
            btn.innerText = "BERHENTI";
            btn.classList.add('rolling');
            toggleInputs(true); // Otomatis kunci kolom input begitu tombol acak pertama ditekan
            
            intervalId = setInterval(() => {
                const randomIndex = Math.floor(Math.random() * availableNumbers.length);
display.innerText = availableNumbers[randomIndex];
}, 50);
} else {
clearInterval(intervalId);
isRolling = false;
const finalIndex = Math.floor(Math.random() * availableNumbers.length);
const pickedNumber = availableNumbers.splice(finalIndex, 1)[0];
display.innerText = pickedNumber;
chosenNumbers.push(pickedNumber);
renderHistoryItem(chosenNumbers.length, pickedNumber);
currentPerson++;
saveToLocalStorage();
updateUIState();
}
}
function renderHistoryItem(order, number) {
const li = document.createElement('li');
li.className = 'history-item';
li.innerText = `Orang ${order} → Kursi ${number}`;
historyList.appendChild(li);
}
function resetData() {
if (confirm("Apakah Anda yakin ingin me-reset aplikasi? Seluruh riwayat saat ini akan dihapus.")) {
try {
    storageKeys.forEach(key => window.localStorage.removeItem(key));
} catch (error) {
    showStorageWarning(error);
}
initNewGame();
}
}
// Fungsi Utama Ekspor Data ke CSV Excel
function exportToCSV() {
if (chosenNumbers.length === 0) {
alert("Belum ada data undian yang bisa disimpan.");
return;
}
// Membuat format isi konten CSV dengan penanda BOM agar huruf/simbol terbaca rapi di Excel Windows/Mac
let csvContent = "\uFEFF";
csvContent += "Urutan Antrean/Orang,Nomor Kursi Terpilih\n";
chosenNumbers.forEach((num, index) => {
csvContent += `Orang ke-${index + 1},Kursi Nomor ${num}\n`;
});
// Membuat trigger unduhan file otomatis browser
const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
const url = URL.createObjectURL(blob);
const link = document.createElement("a");
link.setAttribute("href", url);
link.setAttribute("download", `Hasil_Undian_Kursi_${new Date().toISOString().slice(0,10)}.csv`);
document.body.appendChild(link);
link.click();
document.body.removeChild(link);
}
function initializeApp() {
    inputPeople.addEventListener('change', applySettings);
    inputSeats.addEventListener('change', applySettings);
    btn.addEventListener('click', handleButtonClick);
    document.getElementById('export-btn').addEventListener('click', exportToCSV);
    document.getElementById('reset-btn').addEventListener('click', resetData);
    loadSavedData();
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initializeApp);
} else {
    initializeApp();
}
